name: Terraform Plan - Dev Branch

on:
  push:
    branches: [dev]

jobs:
  terraform-plan:
    name: Terraform Plan on Dev
    runs-on: ubuntu-latest

    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

    permissions:
      contents: read
      id-token: write  # For OIDC auth (if used)
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform Cloud Credentials
        run: |
          mkdir -p ~/.terraform.d
          cat > ~/.terraform.d/credentials.tfrc.json <<EOF
          {
            "credentials": {
              "app.terraform.io": {
                "token": "${TF_API_TOKEN}"
              }
            }
          }
          EOF

      - name: Terraform Init (Terraform Cloud)
        run: terraform init -input=false
        working-directory: infra/

      - name: Select Workspace Based on Branch
        run: |
          case "${GITHUB_REF##*/}" in
            dev)
              WORKSPACE="expense-tracker-infra-dev"
              ;;
            master)
              WORKSPACE="expense-tracker-infra-prd"
              ;;
            *)
              echo "Branch not mapped to a workspace."
              exit 1
              ;;
          esac
          echo "Using workspace: $WORKSPACE"
          terraform workspace select "$WORKSPACE"
        working-directory: infra/

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform plan -input=false -var-file=env/dev.tfvars
        working-directory: infra/
